[package]
name = "virt-manager"
description = "GTK4 desktop GUI for managing libvirt VMs — see ticket 05 (toolkit choice) and the per-screen tickets in .scratch/rust-conversion/issues/."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "virt-manager"
path = "src/main.rs"

[dependencies]
virtinst-core = { path = "../virtinst-core" }
